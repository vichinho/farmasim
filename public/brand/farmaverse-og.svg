  <text x="88" y="240" fill="#FAFAF7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="94" font-weight="750" letter-spacing="-5">Farma<tspan fill="#6EE7B7">Verse</tspan></text>
